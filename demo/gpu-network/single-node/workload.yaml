apiVersion: v1
kind: Namespace
metadata:
  name: amd-demo-gpu-network
  labels:
    amd-gpu-mock/demo: "true"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: tiny-llm-gpu
  namespace: amd-demo-gpu-network
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.amd.com
---
apiVersion: v1
kind: Pod
metadata:
  name: tiny-llm-gpu-network
  namespace: amd-demo-gpu-network
  labels:
    app: tiny-llm-gpu-network
spec:
  nodeSelector:
    kubernetes.io/hostname: amd-ernic-worker-1
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 2
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: tiny-llm-gpu
  containers:
  - name: tiny-llm
    image: docker.io/library/python:3.11-slim
    command: [python3, -u, /app/app.py]
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    ports:
    - name: http
      containerPort: 8000
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 2
      periodSeconds: 5
      timeoutSeconds: 3
    resources:
      claims:
      - name: gpu
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 128Mi
        amd.com/nic: 1
    volumeMounts:
    - name: app
      mountPath: /app
      readOnly: true
  volumes:
  - name: app
    configMap:
      name: tiny-llm-app
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-llm
  namespace: amd-demo-gpu-network
spec:
  selector:
    app: tiny-llm-gpu-network
  ports:
  - name: http
    port: 8000
    targetPort: http
