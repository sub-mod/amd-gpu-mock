kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        - name: node-labels
          value: "spur.amd.com/managed=true,spur.amd.com/gpu-type=mi300x,spur.amd.com/gpu-memory-mb=196608"
