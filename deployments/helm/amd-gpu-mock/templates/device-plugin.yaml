{{- if .Values.devicePlugin.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "amd-gpu-mock.fullname" . }}-device-plugin
  namespace: kube-system
  labels:
    {{- include "amd-gpu-mock.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-gpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-gpu-device-plugin
    spec:
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: device-plugin
          image: {{ .Values.devicePlugin.image }}
          imagePullPolicy: {{ .Values.devicePlugin.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: {{ .Values.mockRootDir }}/sys
        - name: dev
          hostPath:
            path: {{ .Values.mockRootDir }}/dev
{{- end }}
