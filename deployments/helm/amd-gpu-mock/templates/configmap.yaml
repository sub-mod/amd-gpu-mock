{{- $profile := .Files.Get (printf "profiles/%s.yaml" .Values.gpu.profile) | fromYaml -}}
{{- if ne (toString .Values.gpu.count) "" -}}
{{- $text := toString .Values.gpu.count -}}
{{- if not (regexMatch "^[1-9][0-9]*$" $text) -}}
{{- fail "gpu.count must be a positive integer within the selected profile inventory" -}}
{{- end -}}
{{- $count := int $text -}}
{{- if gt $count (len $profile.devices) -}}
{{- fail "gpu.count exceeds the selected profile inventory" -}}
{{- end -}}
{{- $_ := set $profile "devices" (slice $profile.devices 0 $count) -}}
{{- $bdfs := list -}}
{{- range $profile.devices -}}{{- $bdfs = append $bdfs .pci_bdf -}}{{- end -}}
{{- $roots := list -}}
{{- range $profile.pcie_topology.root_complexes -}}
{{- $devices := list -}}
{{- range .devices -}}{{- if has . $bdfs -}}{{- $devices = append $devices . -}}{{- end -}}{{- end -}}
{{- if $devices -}}
{{- $_ := set . "devices" $devices -}}
{{- $roots = append $roots . -}}
{{- end -}}
{{- end -}}
{{- $_ := set $profile.pcie_topology "root_complexes" $roots -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "amd-gpu-mock.fullname" . }}
  labels:
    {{- include "amd-gpu-mock.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $profile | nindent 4 }}
