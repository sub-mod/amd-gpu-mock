gpu:
  # GPU profile: mi210, mi250x, mi300a, mi300x, mi325x, mi350x, mi355x
  profile: mi300x
  # Fixed schedulable topology: SPX or MI300X DPX/NPS2 (two 96-GiB partitions).
  partition: SPX
  # Number of mock GPUs per node (empty = derive from profile)
  count: ""

image:
  repository: docker.io/submod/amd-gpu-mock
  tag: ""
  pullPolicy: IfNotPresent

devicePlugin:
  enabled: false
  image: rocm/k8s-device-plugin:latest
  imagePullPolicy: IfNotPresent

nodeSelector: {}

tolerations:
  - operator: Exists

mockRootDir: /var/lib/amd-gpu-mock

api:
  port: 8080

# The kind quick start maps this NodePort to localhost:8080.
dashboard:
  enabled: true
  nodePort: 30080

nri:
  # NRI injects GPU visibility into pods that don't request amd.com/gpu.
  # Not needed for standard GPU scheduling — only for monitoring/debugging pods.
  enabled: false

prometheus:
  serviceMonitor:
    enabled: false
    interval: 15s

# DRA is the default allocator. For device-plugin mode set dra.enabled=false
# and devicePlugin.enabled=true.
# This installs the pinned upstream driver; no user image build is needed.
dra:
  enabled: true
  allowDefaultNamespace: false
  image:
    repository: docker.io/submod/amd-gpu-dra-driver
    tag: v1.0.0-mock.3
    pullPolicy: IfNotPresent
  mockSysPath: /var/lib/amd-gpu-mock/sys
  kubeletPlugin:
    # Match nodeSelector above when limiting the mock to particular nodes.
    nodeSelector: {}

# Real AMD exporter + GPU Agent, using the AMD SMI mock backend.
metricsExporter:
  enabled: true
  # Metrics collection can exceed one second on emulated workers.
  readinessTimeoutSeconds: 5
  image: docker.io/submod/amd-device-metrics-exporter:v1.5.2-mock.2
  imagePullPolicy: IfNotPresent
  serviceMonitor:
    enabled: false
    interval: 15s

# Standard Prometheus + Grafana, scraping the real AMD exporter.
# For an external monitoring stack set monitoring.enabled=false.
monitoring:
  enabled: true
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0-distroless
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  grafana:
    enabled: true
    image: docker.io/grafana/grafana:13.2.3-distroless
    adminPassword: amdmock
    # kind maps this to localhost:3000; host port is configured separately.
    nodePort: 30300
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
