apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-real-exporter-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  amd-real-exporter.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "GPU Temperature",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "amd_gpu_edge_temperature",
              "legendFormat": "GPU {{gpu_id}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "color": {
                "mode": "palette-classic"
              }
            }
          }
        },
        {
          "title": "GPU Power Draw",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "amd_gpu_package_power",
              "legendFormat": "GPU {{gpu_id}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {
                "mode": "palette-classic"
              }
            }
          }
        },
        {
          "title": "GPU Utilization",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "amd_gpu_gfx_activity",
              "legendFormat": "GPU {{gpu_id}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "color": {
                "mode": "palette-classic"
              }
            }
          }
        },
        {
          "title": "VRAM Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "amd_gpu_used_vram * 1048576 / 1073741824",
              "legendFormat": "GPU {{gpu_id}} Used"
            },
            {
              "expr": "amd_gpu_total_vram * 1048576 / 1073741824",
              "legendFormat": "GPU {{gpu_id}} Total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decgbytes",
              "color": {
                "mode": "palette-classic"
              }
            }
          }
        },
        {
          "title": "GPU Clock Frequencies",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "avg by (gpu_id) (amd_gpu_clock{clock_type=\"system\"})",
              "legendFormat": "GPU {{gpu_id}} GFX"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "rotmhz",
              "color": {
                "mode": "palette-classic"
              }
            }
          }
        },
        {
          "title": "ECC Errors",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "expr": "amd_gpu_ecc_uncorrect_total",
              "legendFormat": "GPU {{gpu_id}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "amd",
        "gpu",
        "mock"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "title": "AMD GPU Fleet \u2014 Device Metrics Exporter",
      "uid": "amd-real-exporter"
    }
