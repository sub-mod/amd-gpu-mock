# KIND cluster config for the AMD GPU mock.
# Use with the custom node image:
#   kind create cluster --name amd-mock \
#     --image docker.io/submod/amd-mock-kind-node:0.2.2 \
#     --config deployments/kind-node/kind-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
    labels:
      # GPU Operator targets this label
      feature.node.kubernetes.io/amd-gpu: "true"
      # Mock GPU type
      amd-gpu-mock.amd.com/type: sgpu
