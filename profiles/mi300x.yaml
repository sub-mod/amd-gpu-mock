# AMD Instinct MI300X Mock Profile
# 8-GPU OAM configuration (SPX mode)

version: "1.0"

system:
  amdgpu_version: "6.19.4"
  rocm_version: "7.14.0"
  amdsmi_version: "27.0.0"

device_defaults:
  name: "AMD Instinct MI300X"
  # Raw sysfs product_name. Matches the productName AMD uses in its own
  # DRA examples (AMD_Instinct_MI300X_OAM after spaces become underscores).
  product_name: "AMD Instinct MI300X OAM"
  vendor_id: 0x1002
  device_id: 0x74a1
  subsystem_vendor_id: 0x1002
  subsystem_device_id: 0x74a1
  gfx_target_version: 90402          # gfx942
  architecture: "cdna3"

  compute:
    cu_count: 304
    simd_per_cu: 4
    simd_count: 1216                   # 304 * 4 / num_xcc factored
    stream_processors: 19456
    wave_front_size: 64
    array_count: 38
    simd_arrays_per_engine: 2
    cu_per_simd_array: 8
    num_xcc: 8
    max_waves_per_simd: 16
    lds_size_in_kb: 64
    gds_size_in_kb: 0
    num_sdma_engines: 2
    num_sdma_xgmi_engines: 6
    num_cp_queues: 128

  memory:
    vram_type: "hbm3"
    vram_size_bytes: 206158430208     # ~192 GB
    vram_used_bytes: 314572800        # ~300 MB baseline
    vram_bus_width: 8192
    vis_vram_size_bytes: 206158430208
    gtt_size_bytes: 536854528000
    max_mem_clk_mhz: 1300

  power:
    current_socket_power_w: 183
    default_power_cap_w: 750
    max_power_cap_w: 750
    min_power_cap_w: 0

  thermal:
    edge_temperature_c: 49
    hotspot_temperature_c: 52
    mem_temperature_c: 48
    shutdown_temperature_c: 110
    slowdown_temperature_c: 100

  clocks:
    max_gfx_clk_mhz: 2100
    min_gfx_clk_mhz: 500
    current_gfx_clk_mhz: 500
    max_mem_clk_mhz: 1300
    min_mem_clk_mhz: 900
    current_mem_clk_mhz: 1300

  pcie:
    gen: 5
    width: 16
    max_gen: 5
    max_width: 16
    replay_count: 0

  ecc:
    enabled: true
    correctable_count: 0
    uncorrectable_count: 0

  firmware:
    pmfw_version: "00.68.99.00"

  utilization:
    gfx_activity_percent: 0
    umc_activity_percent: 0
    mm_activity_percent: 0

  partition:
    mode: "SPX"
    nps_mode: "NPS1"

xgmi:
  hive_id: "0x1234567890abcdef"
  links_per_gpu: 7
  lanes_per_link: 16
  bandwidth_per_link_gbps: 50
  link_type: 11                       # xGMI type in io_links

pcie_topology:
  root_complexes:
    - id: "pci0000:00"
      numa_node: 0
      devices:
        - "0000:05:00.0"
        - "0000:26:00.0"
        - "0000:46:00.0"
        - "0000:65:00.0"
    - id: "pci0000:80"
      numa_node: 1
      devices:
        - "0000:85:00.0"
        - "0000:a6:00.0"
        - "0000:c6:00.0"
        - "0000:e5:00.0"

devices:
  - index: 0
