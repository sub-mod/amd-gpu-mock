site_name: AMD GPU Mock
site_description: Run AMD GPU orchestration and monitoring demos without physical GPUs.
site_url: https://sub-mod.github.io/amd-gpu-mock/
repo_url: https://github.com/sub-mod/amd-gpu-mock
repo_name: sub-mod/amd-gpu-mock
docs_dir: tmp/docs-source
site_dir: tmp/docs-site
use_directory_urls: true
theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - General:
      - Overview: index.md
      - Getting started:
          - Quick start: docs/site/getting-started.md
          - Choose a demo: docs/site/demos.md
      - Architecture:
          - Component diagrams: docs/architecture.md
          - Mock interfaces and responsibilities: docs/how-it-works.md
      - Reference:
          - GPU profiles: docs/profiles.md
          - Prepared worker image: artifacts/ernic-worker/README.md
      - Troubleshooting: docs/site/troubleshooting.md
  - Guides:
      - Overview: docs/site/scenarios.md
      - Scenarios:
          - AMD device plugin: docs/guides/device-plugin.md
          - AMD DRA driver: docs/guides/dra.md
          - AMD GPU Operator: docs/guides/gpu-operator.md
          - Tiny LLM: demo/llm/README.md
          - DRA allocation: demo/dra/README.md
          - Multiple GPUs: demo/multi-gpu/README.md
          - Same-GPU partition allocation: demo/partition-allocation/README.md
          - GPU and NIC worker: demo/gpu-network/single-node/README.md
          - Spur batch scheduling: demo/spur/README.md
          - Two-worker RDMA: demo/gpu-network/two-node/README.md
      - Tasks:
          - Allocation and release: demo/allocation/README.md
          - Failure injection: demo/faults/README.md
          - Prometheus and Grafana: demo/telemetry/README.md
          - Virtual partition controls: demo/partitioning/README.md
          - Switching GPU profiles: demo/profiles/README.md
      - Details:
          - Presenter guide: demo/README.md
          - Partition architecture: docs/guides/partition-allocation.md
          - Telemetry architecture: docs/guides/telemetry.md
          - GPU and network setup: docs/guides/gpu-network.md
  - Contributing:
      - Testing: docs/guides/testing.md
      - Documentation site: docs/site/maintaining.md
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
