# Runs AMD's DRA driver discovery code against every GPU profile.
# Fast (no cluster), so it runs on every PR. The full kind test is
# tests/dra/validate_dra.sh.
name: dra-discovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - uses: azure/setup-helm@v4
      - name: Chart configuration contracts
        run: tests/dra/chart-validation.sh
      - name: Renderer contract tests
        run: go test ./pkg/gpu/kfd
      - name: AMD DRA driver discovery, all profiles
        run: tests/dra/discovery-check.sh
      - name: AMD DRA driver discovery, MI300X DPX/NPS2
        run: PARTITION_MODE=DPX tests/dra/discovery-check.sh mi300x
